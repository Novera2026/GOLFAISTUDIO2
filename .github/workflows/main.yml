name: GOLF FASHION AI

on:
  push:
    branches: ["main"] # Tự động chạy mỗi khi bạn push code lên nhánh main

  # Cho phép bạn chủ động bấm chạy thủ công từ tab Actions nếu muốn
  workflow_dispatch:

# Thiết lập quyền hạn cho GITHUB_TOKEN để có thể deploy lên GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Đảm bảo các lượt build cũ đang chạy sẽ bị hủy nếu bạn push code mới liên tục
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cài đặt các thư viện (Dependencies)
        run: npm ci || npm install

      - name: Build dự án với API Key bảo mật
        run: npm run build
        env:
          # Truyền trực tiếp Key từ GitHub Secrets vào môi trường build của Vite
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v5

      - name: Nén và tải thư mục sản phẩm lên hệ thống
        uses: actions/upload-pages-artifact@v3
        with:
          # Vite mặc định xuất sản phẩm ra thư mục 'dist'
          path: './dist'

      - name: Triển khai lên GitHub Pages thật
        id: deployment
        uses: actions/deploy-pages@v4
