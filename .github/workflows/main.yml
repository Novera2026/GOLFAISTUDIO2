name: Deploy to Google Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch: # Giữ lại nút "Run workflow" để bạn có thể chủ động bấm chạy thủ công

permissions:
  contents: 'read'
  id-token: 'write' # BẮT BUỘC để Workload Identity hoạt động ổn định

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/964512664154/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          service_account: 'ais-gemini-key-fcf8aec67b8c433@964512664154.iam.gserviceaccount.com'

      - name: 'Deploy to Cloud Run'
        run: |
          # Triển khai trực tiếp lên Cloud Run bằng cách chỉ định rõ Project ID mới của bạn
          gcloud run deploy golf-ai-studio \
            --source . \
            --region asia-east1 \
            --allow-unauthenticated \
            --project project-1d31ccc5-4336-4503-ab8
