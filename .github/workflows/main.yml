name: Deploy to Google Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch: # Kích hoạt nút "Run workflow" thủ công trên giao diện GitHub

permissions:
  contents: 'read'
  id-token: 'write' # BẮT BUỘC để Workload Identity hoạt động

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/964512664154/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          service_account: 'ais-gemini-key-fcf8aec67b8c433@964512664154.iam.gserviceaccount.com'

      - name: 'Deploy to Cloud Run'
        run: |
          # 1. Cấu hình Project ID chính xác từ Google Cloud Console của bạn
          gcloud config set project project-d15a0ecc-61b2-40a3-a91
          
          # 2. Tiến hành triển khai ứng dụng lên Cloud Run
          gcloud run deploy golf-ai-studio \
            --source . \
            --region asia-east1 \
            --allow-unauthenticated
